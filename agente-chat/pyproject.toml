[project]
name = "agente-chat"
version = "0.1.0"
description = "InvestIA — agente conversacional explicador (AGENTE-CHAT-IA.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
